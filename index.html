<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Escolar y Exámenes</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .sidebar { min-height: 100vh; background-color: #1e293b; color: white; }
    .sidebar .nav-link { color: #cbd5e1; }
    .sidebar .nav-link.active { background-color: #2563eb; color: white; }
    .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <!-- Navegación Lateral -->
    <div class="col-md-3 col-lg-2 sidebar p-3">
      <h4 class="text-center mb-4"><i class="fa-solid fa-school me-2"></i>EduControl</h4>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-2">
          <a href="#" class="nav-link active" onclick="switchTab('colegios')"><i class="fa-solid fa-building me-2"></i>Colegios</a>
        </li>
        <li class="nav-item mb-2">
          <a href="#" class="nav-link" onclick="switchTab('grados')"><i class="fa-solid fa-graduation-cap me-2"></i>Grados y Secciones</a>
        </li>
        <li class="nav-item mb-2">
          <a href="#" class="nav-link" onclick="switchTab('examenes')"><i class="fa-solid fa-file-pen me-2"></i>Crear Examen</a>
        </li>
      </ul>
    </div>

    <!-- Contenido Principal -->
    <div class="col-md-9 col-lg-10 p-4">
      
      <!-- SECCIÓN: COLEGIOS -->
      <div id="sec-colegios">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2>Gestión de Colegios</h2>
          <button class="btn btn-primary" onclick="openColegioModal()"><i class="fa-solid fa-plus me-2"></i>Agregar Colegio</button>
        </div>
        <div class="card p-3 mb-4">
          <input type="text" id="searchColegio" class="form-control" placeholder="Buscar colegio por nombre..." onkeyup="renderColegios()">
        </div>
        <div class="card p-3">
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Nombre del Colegio</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tblColegios"></tbody>
          </table>
        </div>
      </div>

      <!-- SECCIÓN: GRADOS Y SECCIONES -->
      <div id="sec-grados" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2>Gestión de Grados y Secciones</h2>
          <button class="btn btn-primary" onclick="openGradoModal()"><i class="fa-solid fa-plus me-2"></i>Agregar Grado</button>
        </div>
        <div class="card p-3 mb-4">
          <input type="text" id="searchGrado" class="form-control" placeholder="Buscar por colegio o grado..." onkeyup="renderGrados()">
        </div>
        <div class="card p-3">
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Colegio</th>
                <th>Grado</th>
                <th>Sección</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tblGrados"></tbody>
          </table>
        </div>
      </div>

      <!-- SECCIÓN: EXÁMENES -->
      <div id="sec-examenes" style="display: none;">
        <h2 class="mb-4">Creación de Exámenes</h2>
        <div class="card p-4">
          <form id="formExamen" onsubmit="guardarExamen(event)">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">Título del Examen</label>
                <input type="text" id="examTitulo" class="form-control" required placeholder="Ej: Evaluación Parcial de Programación">
              </div>
              <div class="col-md-3">
                <label class="form-label">Colegio</label>
                <select id="examColegio" class="form-select" required></select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Grado y Sección</label>
                <select id="examGrado" class="form-select" required></select>
              </div>
            </div>

            <hr class="my-4">
            <h4>Preguntas del Examen</h4>
            <div id="containerPreguntas"></div>

            <div class="d-flex gap-2 my-3">
              <button type="button" class="btn btn-outline-success" onclick="agregarPregunta('FV')">
                <i class="fa-solid fa-circle-check me-2"></i>+ Falso / Verdadero
              </button>
              <button type="button" class="btn btn-outline-info" onclick="agregarPregunta('MC')">
                <i class="fa-solid fa-list-check me-2"></i>+ Selección Múltiple
              </button>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3"><i class="fa-solid fa-save me-2"></i>Guardar Examen</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- MODAL: COLEGIO -->
<div class="modal fade" id="modalColegio" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="titleModalColegio">Agregar Colegio</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="colId">
        <div class="mb-3">
          <label class="form-label">Nombre del Colegio</label>
          <input type="text" id="colNombre" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Dirección</label>
          <input type="text" id="colDireccion" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" id="colTelefono" class="form-control">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarColegio()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: GRADO -->
<div class="modal fade" id="modalGrado" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="titleModalGrado">Agregar Grado</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="graId">
        <div class="mb-3">
          <label class="form-label">Colegio</label>
          <select id="graColegioSelect" class="form-select" required></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Nombre del Grado</label>
          <input type="text" id="graNombre" class="form-control" placeholder="Ej: 4to Bachillerato en Computación" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Sección</label>
          <input type="text" id="graSeccion" class="form-control" placeholder="Ej: A" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarGrado()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- SDK Firebase (v9 Compat para integración rápida) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // CONFIGURACIÓN DE FIREBASE (Reemplaza con las llaves de tu proyecto)
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROJECT_ID.firebaseapp.com",
    projectId: "TU_PROJECT_ID",
    storageBucket: "TU_PROJECT_ID.appspot.com",
    messagingSenderId: "TU_SENDER_ID",
    appId: "TU_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Variables Globales
  let colegios = [];
  let grados = [];
  let modalColObj = new bootstrap.Modal(document.getElementById('modalColegio'));
  let modalGraObj = new bootstrap.Modal(document.getElementById('modalGrado'));

  // Carga Inicial
  window.onload = () => {
    cargarColegios();
    cargarGrados();
  };

  function switchTab(tab) {
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
    
    document.getElementById('sec-colegios').style.display = tab === 'colegios' ? 'block' : 'none';
    document.getElementById('sec-grados').style.display = tab === 'grados' ? 'block' : 'none';
    document.getElementById('sec-examenes').style.display = tab === 'examenes' ? 'block' : 'none';

    if(tab === 'examenes') cargarSelectsExamen();
  }

  // ==================== MÓDULO COLEGIOS ====================
  function cargarColegios() {
    db.collection("colegios").onSnapshot(snapshot => {
      colegios = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderColegios();
      actualizarSelectColegios();
    });
  }

  function renderColegios() {
    const filter = document.getElementById('searchColegio').value.toLowerCase();
    const tbody = document.getElementById('tblColegios');
    tbody.innerHTML = '';
    
    colegios.filter(c => c.nombre.toLowerCase().includes(filter)).forEach(c => {
      tbody.innerHTML += `
        <tr>
          <td><strong>${c.nombre}</strong></td>
          <td>${c.direccion || '-'}</td>
          <td>${c.telefono || '-'}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-warning me-1" onclick="editColegio('${c.id}')"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteColegio('${c.id}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    });
  }

  function openColegioModal() {
    document.getElementById('colId').value = '';
    document.getElementById('colNombre').value = '';
    document.getElementById('colDireccion').value = '';
    document.getElementById('colTelefono').value = '';
    document.getElementById('titleModalColegio').innerText = 'Agregar Colegio';
    modalColObj.show();
  }

  function editColegio(id) {
    const c = colegios.find(item => item.id === id);
    if (!c) return;
    document.getElementById('colId').value = c.id;
    document.getElementById('colNombre').value = c.nombre;
    document.getElementById('colDireccion').value = c.direccion || '';
    document.getElementById('colTelefono').value = c.telefono || '';
    document.getElementById('titleModalColegio').innerText = 'Editar Colegio';
    modalColObj.show();
  }

  async function guardarColegio() {
    const id = document.getElementById('colId').value;
    const data = {
      nombre: document.getElementById('colNombre').value.trim(),
      direccion: document.getElementById('colDireccion').value.trim(),
      telefono: document.getElementById('colTelefono').value.trim()
    };
    if (!data.nombre) return alert("El nombre es obligatorio");

    if (id) {
      await db.collection("colegios").doc(id).update(data);
    } else {
      await db.collection("colegios").add(data);
    }
    modalColObj.hide();
  }

  async function deleteColegio(id) {
    if (confirm("¿Deseas eliminar este colegio?")) {
      await db.collection("colegios").doc(id).delete();
    }
  }

  // ==================== MÓDULO GRADOS Y SECCIONES ====================
  function cargarGrados() {
    db.collection("grados").onSnapshot(snapshot => {
      grados = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderGrados();
    });
  }

  function renderGrados() {
    const filter = document.getElementById('searchGrado').value.toLowerCase();
    const tbody = document.getElementById('tblGrados');
    tbody.innerHTML = '';

    grados.filter(g => {
      const colNombre = (colegios.find(c => c.id === g.colegioId)?.nombre || '').toLowerCase();
      return g.nombre.toLowerCase().includes(filter) || colNombre.includes(filter);
    }).forEach(g => {
      const col = colegios.find(c => c.id === g.colegioId);
      tbody.innerHTML += `
        <tr>
          <td>${col ? col.nombre : 'Colegio No Encontrado'}</td>
          <td><strong>${g.nombre}</strong></td>
          <td><span class="badge bg-secondary">${g.seccion}</span></td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-warning me-1" onclick="editGrado('${g.id}')"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteGrado('${g.id}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    });
  }

  function openGradoModal() {
    document.getElementById('graId').value = '';
    document.getElementById('graNombre').value = '';
    document.getElementById('graSeccion').value = '';
    document.getElementById('titleModalGrado').innerText = 'Agregar Grado';
    modalGraObj.show();
  }

  function editGrado(id) {
    const g = grados.find(item => item.id === id);
    if (!g) return;
    document.getElementById('graId').value = g.id;
    document.getElementById('graColegioSelect').value = g.colegioId;
    document.getElementById('graNombre').value = g.nombre;
    document.getElementById('graSeccion').value = g.seccion;
    document.getElementById('titleModalGrado').innerText = 'Editar Grado';
    modalGraObj.show();
  }

  async function guardarGrado() {
    const id = document.getElementById('graId').value;
    const data = {
      colegioId: document.getElementById('graColegioSelect').value,
      nombre: document.getElementById('graNombre').value.trim(),
      seccion: document.getElementById('graSeccion').value.trim()
    };
    if (!data.colegioId || !data.nombre || !data.seccion) return alert("Todos los campos son obligatorios");

    if (id) {
      await db.collection("grados").doc(id).update(data);
    } else {
      await db.collection("grados").add(data);
    }
    modalGraObj.hide();
  }

  async function deleteGrado(id) {
    if (confirm("¿Deseas eliminar este grado?")) {
      await db.collection("grados").doc(id).delete();
    }
  }

  function actualizarSelectColegios() {
    const selects = [document.getElementById('graColegioSelect'), document.getElementById('examColegio')];
    selects.forEach(select => {
      if (!select) return;
      select.innerHTML = '<option value="">Seleccione Colegio...</option>';
      colegios.forEach(c => {
        select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
      });
    });
  }

  // ==================== MÓDULO CREACIÓN DE EXÁMENES ====================
  let contadorPreguntas = 0;

  function cargarSelectsExamen() {
    actualizarSelectColegios();
    const examColegio = document.getElementById('examColegio');
    const examGrado = document.getElementById('examGrado');
    
    examColegio.onchange = () => {
      const colId = examColegio.value;
      examGrado.innerHTML = '<option value="">Seleccione Grado...</option>';
      grados.filter(g => g.colegioId === colId).forEach(g => {
        examGrado.innerHTML += `<option value="${g.id}">${g.nombre} - Sección ${g.seccion}</option>`;
      });
    };
  }

  function agregarPregunta(tipo) {
    contadorPreguntas++;
    const container = document.getElementById('containerPreguntas');
    const pId = contadorPreguntas;

    let htmlPregunta = `
      <div class="card p-3 mb-3 border-secondary" id="pregunta_${pId}" data-tipo="${tipo}">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5>Pregunta #${pId} <span class="badge ${tipo === 'FV' ? 'bg-info' : 'bg-warning'} text-dark">${tipo === 'FV' ? 'Falso / Verdadero' : 'Selección Múltiple'}</span></h5>
          <button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarPregunta(${pId})"><i class="fa-solid fa-trash"></i></button>
        </div>
        <div class="mb-3">
          <label class="form-label">Enunciado de la Pregunta</label>
          <input type="text" class="form-control preg-enunciado" required placeholder="Escriba la pregunta aquí...">
        </div>
    `;

    if (tipo === 'FV') {
      htmlPregunta += `
        <div class="mb-2">
          <label class="form-label d-block">Respuesta Correcta:</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="resp_correcta_${pId}" value="true" checked>
            <label class="form-check-label">Verdadero</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="resp_correcta_${pId}" value="false">
            <label class="form-check-label">Falso</label>
          </div>
        </div>
      `;
    } else if (tipo === 'MC') {
      htmlPregunta += `
        <div class="mb-2">
          <label class="form-label">Opciones de Respuesta (Marque la radio de la respuesta correcta)</label>
          <div class="opciones-container_${pId}">
            ${[0, 1, 2].map(i => `
              <div class="input-group mb-2">
                <div class="input-group-text">
                  <input class="form-check-input mt-0" type="radio" name="resp_correcta_${pId}" value="${i}" ${i === 0 ? 'checked' : ''}>
                </div>
                <input type="text" class="form-control preg-opcion" required placeholder="Opción ${i + 1}">
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    htmlPregunta += `</div>`;
    container.insertAdjacentHTML('beforeend', htmlPregunta);
  }

  function eliminarPregunta(id) {
    document.getElementById(`pregunta_${id}`)?.remove();
  }

  async function guardarExamen(e) {
    e.preventDefault();
    const titulo = document.getElementById('examTitulo').value.trim();
    const colegioId = document.getElementById('examColegio').value;
    const gradoId = document.getElementById('examGrado').value;
    const domPreguntas = document.querySelectorAll('#containerPreguntas .card');

    if (domPreguntas.length === 0) {
      return alert("Debe agregar al menos una pregunta al examen.");
    }

    const preguntas = [];

    domPreguntas.forEach(card => {
      const tipo = card.getAttribute('data-tipo');
      const enunciado = card.querySelector('.preg-enunciado').value.trim();

      if (tipo === 'FV') {
        const respuestaCorrecta = card.querySelector(`input[name^="resp_correcta_"]:checked`).value === 'true';
        preguntas.push({
          tipo: 'booleano',
          enunciado,
          respuestaCorrecta
        });
      } else if (tipo === 'MC') {
        const opcionesInputs = card.querySelectorAll('.preg-opcion');
        const opciones = Array.from(opcionesInputs).map(input => input.value.trim());
        const respuestaCorrecta = parseInt(card.querySelector(`input[name^="resp_correcta_"]:checked`).value);

        preguntas.push({
          tipo: 'seleccion_multiple',
          enunciado,
          opciones,
          respuestaCorrecta
        });
      }
    });

    const examen = {
      titulo,
      colegioId,
      gradoId,
      preguntas,
      fechaCreacion: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      await db.collection("examenes").add(examen);
      alert("¡Examen guardado exitosamente!");
      document.getElementById('formExamen').reset();
      document.getElementById('containerPreguntas').innerHTML = '';
    } catch (err) {
      console.error("Error al guardar el examen:", err);
      alert("Hubo un error al guardar el examen.");
    }
  }
</script>
</body>
</html>
